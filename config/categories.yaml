# Own taxonomy: food only, organised the way one shops (approved 2026-10-24). Groups (parent:
# none) hold the categories; only categories are selected and collected.
#
# sources: category keys per collector, on a category or on a group.
#   conad_catalog / coop_catalog: the collector requests exactly these category pages.
#   lidl_offers / eurospin_offers: the coarse offer categories (Lidl: wonCategoryPrimary prefix;
#     Eurospin: by_category code). On a group: every category of the group is a candidate.
# A product's category, among the candidates of its site key (ingest/categories.py):
#   1. a catalog key with one candidate: that one (the site decided);
#   2. the first candidate (file order) whose title_rules.include has a word in the head of the
#      title (before "di", "con", "al"...) and whose exclude has none anywhere;
#   3. the single candidate without include words, if there is exactly one;
#   4. otherwise open: decided after the run from the products named alike (services/classify.py),
#      or sent to review when they disagree.
# title_rules: case-insensitive, matched at the start of a word ("crema" does not match
#   "scremato"; "mel" matches "mele" and "melone").
# review: true = mapping is an unverified proposal. Selected categories must have review: false.
# Not collected (decided 2026-10-24): alcohol, baby food, pet food, supplements, non-food.
categories:
