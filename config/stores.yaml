# Store identity, synced into the DB by slug. Addresses come from directories and are
# confirmed during recon (T0.3-T0.5); external_id is filled in at T0.4.
stores:
  - slug: coop_cisanello
    chain: coop
    name: Coop Cisanello
    address: Via Manara Valgimigli 1-3
    cap: "56124"
    external_id: "001303"       # codicePuntoVendita on coopfirenze.it (flyers)
    source_mode: catalog
    visitable: true
    price_source: coop_cascina  # regular prices only ("preț online Cascina")

  - slug: coop_cascina
    chain: coop
    name: Coop Cascina (punto di ritiro)
    address: Via del Fosso Vecchio
    cap: "56012"
    external_id: iestore34446   # storeId on prenotalaspesa (storePolygon 1253)
    source_mode: catalog
    visitable: false            # data source only
    outside_scope_approved: true

  - slug: conad_emanuele_filiberto
    chain: conad
    name: Conad Via Emanuele Filiberto
    address: Via Emanuele Filiberto 9
    cap: "56121"
    external_id: "010529"       # anacanId on conad.it; Ordina e Ritira confirmed on the store page
    source_mode: catalog
    visitable: true

  # The Lidl the user shops at (2026-10-24): Ghezzano, comune of San Giuliano Terme, outside Pisa by
  # the user's decision. Weekly offers come from lidl.it (region 600); the whole catalog with
  # Everli's prices from its Everli storefront (store 5390), labelled "preț online ... (Everli)".
  - slug: lidl_ghezzano
    chain: lidl
    name: Lidl Ghezzano
    address: Via Lorenzo il Magnifico 24, San Giuliano Terme
    cap: "56010"
    external_id: null           # lidl.it publishes no store id
    source_mode: catalog
    visitable: true
    outside_scope_approved: true
    price_source: lidl_everli_ghezzano

  - slug: lidl_everli_ghezzano
    chain: lidl
    name: Lidl Ghezzano (Everli)
    address: Via Lorenzo il Magnifico 24, San Giuliano Terme
    cap: "56010"
    external_id: "5390"         # store id Everli assigns to this address (/api/config)
    source_mode: catalog
    visitable: false            # data source only: Everli's prices may include its markup
    outside_scope_approved: true
    everli_address: {street: Via Lorenzo il Magnifico, street_number: "24", postal_code: "56010",
                     city: San Giuliano Terme, lat: 43.7220276, lng: 10.4281323}

  # Two Eurospin stores exist in Pisa with the same offers; the user chose either (T0.7),
  # so only one is kept. The other: Via del Chiassatello 28, data-store-id 480616.
  - slug: eurospin_da_morrona
    chain: eurospin
    name: Eurospin Via A. da Morrona
    address: Via A. da Morrona 6
    cap: "56121"                # eurospin.com shows the generic "56100"; 56121 from directories
    external_id: "406298"       # data-store-id on eurospin.com
    source_mode: promo_only
    visitable: true
