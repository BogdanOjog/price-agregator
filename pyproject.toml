[project]
name = "pisaprices"
version = "0.1.0"
description = "Price catalog and basket optimizer for supermarkets in Pisa"
authors = [
    { name = "BogdanOjog", email = "ojogbogdan2@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "loguru>=0.7",
    "playwright>=1.45",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "ruamel.yaml>=0.18",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0.30",
    "streamlit>=1.36",
]

[project.scripts]
pisaprices = "pisaprices.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
