name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked
      # no network, no real store pages: tests marked real_fixtures are skipped
      - run: uv run pytest -q
